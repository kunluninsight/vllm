[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-simulator"
version = "0.2.0"
description = "An out-of-tree virtual-time simulator for vLLM"
requires-python = ">=3.11"
dependencies = ["vllm", "numpy"]

[project.optional-dependencies]
ml = ["scikit-learn", "joblib"]
aisimulate = ["aisimulate"]

[project.entry-points."vllm.platform_plugins"]
simulator = "vllm_simulator.plugin:register_platform"

[project.entry-points."vllm.endpoint_plugins"]
simulator_collector = "vllm_simulator.collector:CollectorPlugin"

[tool.setuptools.packages.find]
where = ["src"]
