[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hisim"
dynamic = ["version"]
description = "A high-fidelity LLM inference simulator"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-learn",
    "joblib"
]

[project.optional-dependencies]
benchmark = ["aiohttp"]
# AIConfigurator backs the "aiconfigurator" predictor and the modeled KV
# capacity profiling in hisim.simulation.utils; both are imported lazily.
aiconfigurator = ["aiconfigurator"]
